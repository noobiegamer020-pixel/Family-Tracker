const ac=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume()}catch(e){}return AC};
function chime(){const A=ac();if(!A)return;[[659.25,0],[987.77,.18]].forEach(([f,d])=>{const o=A.createOscillator(),g=A.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(A.destination);const n=A.currentTime+d;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.16,n+.04);g.gain.exponentialRampToValueAtTime(.001,n+1);o.start(n);o.stop(n+1.05)})}
document.addEventListener("touchstart",()=>ac(),{once:true});document.addEventListener("click",()=>ac(),{once:true});
function banner(title,body,pgn){const e=$("#ban");banPg=pgn||0;e.innerHTML=`<b>${esc(title)}</b><span>${esc(body).replace(/\n/g,"<br>")}</span>`;e.classList.add("s");clearTimeout(banT);banT=setTimeout(()=>e.classList.remove("s"),6500)}
async function notify(title,body,pgn){if(S.snd!==false)chime();banner(title,body,pgn);const L=LN();if(L){try{await L.schedule({notifications:[{id:Date.now()%2147483000,title,body,channelId:"couple"}]})}catch(e){}}else if("Notification" in window&&Notification.permission=="granted"){try{new Notification(title,{body})}catch(e){}}}
async function initNotif(){const L=LN();if(!L){if("Notification" in window&&Notification.permission=="default")try{Notification.requestPermission()}catch(e){}return}try{const p=await L.requestPermissions();if(p.display!="granted")return;await L.createChannel({id:"couple",name:"Couple updates",description:"Updates from your partner and reminders",importance:5,visibility:1,sound:"soft.wav",vibration:true,lights:true});await L.cancel({notifications:[{id:8}]});await L.schedule({notifications:[{id:8,title:t("eve1"),body:t("eve2"),channelId:"couple",schedule:{on:{hour:20,minute:0},allowWhileIdle:true}}]})}catch(e){}}
const dd2=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
function hinfo(k){const h=(S.hab||{})[k];if(!h||h.d.length<2)return null;let x=0;for(let n=1;n<h.d.length;n++)x+=dd2(h.d[n-1],h.d[n]);const avg=Math.max(1,Math.round(x/(h.d.length-1))),ago=dd2(h.d[h.d.length-1],addd(0));return{avg,ago,due:ago>=avg-1}}
function habHtml(k){const e=Object.keys(S.hab||{}).filter(x=>x.startsWith(k+"|")).map(x=>hinfo(x)).filter(Boolean)[0];return`<div class="hab">${e?t("hab1").replace("{n}",e.avg).replace("{m}",e.ago):t("habtip")}</div>`}
function habCheck(){Object.entries(S.hab||{}).forEach(([k,h])=>{const i=hinfo(k);if(i&&i.due&&S.fired["h"+k]!=addd(0)){S.fired["h"+k]=addd(0);const f=find(h.line.k);notify("🔁 "+f[1]+" "+iname(f),t("hab1").replace("{n}",i.avg).replace("{m}",i.ago))}})}
let lpT=null,lpX=0,lpY=0,lpDone=0;

else if(a=="cu")cuSheet(el.dataset.i)}

function editLine(l,after){const f=find(l.k),u0=f[4],UO=u0=="n"?["n","d"]:[u0,"n","d"],UL={w:"kg",l:"L",n:"×",d:"DA 💰"},V=vr(f),fl=[];

sheet("✏️ "+f[1]+" "+iname(f),fl,[t("save")],v=>{const a=num(v.a);if(!a)return false;l.a=a;l.u=UO[v.cu];l.n=v.nt.trim();if(V)l.v=v.v;save();after()})}
function editTask(g){sheet("✏️ "+tr(g.n),[{t:"text",k:"n",l:t("title"),v:tr(g.n)},{t:"chips",k:"pr",l:t("pri"),o:[t("low"),t("med"),t("high")],v:g.pr},{t:"time",k:"time",l:t("time"),v:g.time||""},{t:"date",k:"dd",l:t("when"),v:g.dd||addd(0)}],[t("save")],v=>{if(!v.n.trim())return false;g.n=(typeof g.n=="object"&&v.n.trim()==tr(g.n))?g.n:v.n.trim();g.pr=v.pr;g.time=v.time;g.dd=v.dd||g.dd;render();toast(t("saved2"))})}
function cuSheet(key){const c=S.cu.find(x=>x.k==key);if(!c)return;sheet("✏️ "+c.e+" "+c.n,[{t:"text",k:"n",l:t("name"),v:c.n}],[t("save")],v=>{if(!v.n.trim())return false;c.n=v.n.trim();render();toast(t("saved2"))},`<button class="ok dl" data-a="cudel" data-key="${esc(key)}">🗑️ ${t("del")}</button>`)}
let PIC="";
const picHtml=()=>`<label>${t("pic")}</label><div class="picrow"><label class="picb">${t("cam")}<input type="file" accept="image/*" capture="environment" id="fpic" hidden></label><label class="picb">${t("gal")}<input type="file" accept="image/*" id="fpic2" hidden></label></div><div style="position:relative"><img id="pimg" class="pimg" style="display:none"><button class="x pix" id="picx" data-a="picx" style="display:none">✕</button></div>`;

function shrink(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=300,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.62))};im.onerror=()=>r("");im.src=fr.result};fr.readAsDataURL(f)})}
document.addEventListener("change",e=>{const el=e.target;if(el.id=="fpic"||el.id=="fpic2"){const f=el.files&&el.files[0];if(f)shrink(f).then(u=>{PIC=u;picShow()})}});
